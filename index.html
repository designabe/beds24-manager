<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2563eb">
    <meta name="description" content="Beds24統合型経営管理システム - AI分析・イベント検知・収益最適化">
    <title>Beds24経営管理システム Pro</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior: none;
        }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .animate-spin { animation: spin 1s linear infinite; }
        .animate-fadeIn { animation: fadeIn 0.3s ease-in; }
        
        select, input, textarea, button { font-size: 16px !important; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        
        .calendar-cell { transition: all 0.2s; }
        .calendar-cell:hover { transform: scale(1.05); }
        .calendar-cell.selected { background: rgba(59, 130, 246, 0.1); }
        
        @media (max-width: 640px) {
            .mobile-menu {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                background: white;
                border-top: 1px solid #e5e7eb;
                z-index: 50;
                padding-bottom: env(safe-area-inset-bottom);
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useCallback, useRef } = React;

        // ========== ユーティリティ関数 ==========
        const storage = {
            get: (key, defaultValue = null) => {
                try {
                    const item = localStorage.getItem(key);
                    return item ? JSON.parse(item) : defaultValue;
                } catch { return defaultValue; }
            },
            set: (key, value) => {
                try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
            },
            remove: (key) => {
                try { localStorage.removeItem(key); } catch {}
            }
        };

        const formatCurrency = (value) => `¥${Math.round(value).toLocaleString()}`;
        const formatPercent = (value, decimals = 1) => `${value.toFixed(decimals)}%`;
        const formatDate = (date) => new Intl.DateTimeFormat('ja-JP').format(date);

        // ========== メインアプリケーション ==========
        const Beds24App = () => {
            // 状態管理
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isApiConnected, setIsApiConnected] = useState(!!storage.get('beds24_api_key'));
            const [showApiSettings, setShowApiSettings] = useState(!isApiConnected);
            const [apiKey, setApiKey] = useState(storage.get('beds24_api_key', ''));
            const [propKey, setPropKey] = useState(storage.get('beds24_prop_key', ''));
            const [isSyncing, setIsSyncing] = useState(false);
            const [connectionStatus, setConnectionStatus] = useState({ tested: false, success: false, message: '' });
            
            // カレンダー操作
            const [selectedCells, setSelectedCells] = useState([]);
            const [isDragging, setIsDragging] = useState(false);
            const [contextMenu, setContextMenu] = useState(null);
            const [showBulkEditModal, setShowBulkEditModal] = useState(false);
            const [bulkEditType, setBulkEditType] = useState(null);
            const [roomAvailability, setRoomAvailability] = useState({});
            const [roomPrices, setRoomPrices] = useState({});
            const [selectedRoom, setSelectedRoom] = useState(null);
            
            // AI分析
            const [showAnalysis, setShowAnalysis] = useState(false);
            const [analysisLoading, setAnalysisLoading] = useState(false);
            const [aiAnalysis, setAiAnalysis] = useState(null);
            
            // イベント検知
            const [showEventAlert, setShowEventAlert] = useState(false);
            const [eventAlerts, setEventAlerts] = useState([]);
            const [isCheckingEvents, setIsCheckingEvents] = useState(false);
            const [propertyLocation, setPropertyLocation] = useState(storage.get('property_location', '東京'));
            
            // 経費・予算
            const [expenses, setExpenses] = useState(() => storage.get('expenses', {
                rent: 500000, cleaning: 3000, utilities: 80000, other: 120000
            }));
            
            useEffect(() => { storage.set('expenses', expenses); }, [expenses]);
            useEffect(() => { storage.set('property_location', propertyLocation); }, [propertyLocation]);

            // データ設定
            const otaCommissions = { booking: 15, airbnb: 3, expedia: 18, rakuten: 10, direct: 0 };
            const budget = { monthlyRevenue: 3500000, targetOccupancy: 75, targetADR: 12000 };
            const lastYearData = { revenue: 2800000, occupancy: 65, adr: 11000, revpar: 7150 };
            const competitorData = { avgADR: 11500 };

            const rooms = [
                { id: 1, name: 'デラックス 101', type: 'deluxe' },
                { id: 2, name: 'デラックス 102', type: 'deluxe' },
                { id: 3, name: 'スタンダード 201', type: 'standard' },
                { id: 4, name: 'スタンダード 202', type: 'standard' },
                { id: 5, name: 'スイート 301', type: 'suite' }
            ];

            const otas = {
                booking: { name: 'Booking.com', color: '#003580' },
                airbnb: { name: 'Airbnb', color: '#FF5A5F' },
                expedia: { name: 'Expedia', color: '#FFCB00' },
                direct: { name: '直接予約', color: '#10B981' },
                rakuten: { name: '楽天', color: '#BF0000' }
            };

            // ダミーデータ生成
            const generateBookings = useCallback(() => {
                const bookings = [];
                const today = new Date();
                for (let day = 1; day <= 31; day++) {
                    rooms.forEach(room => {
                        if (Math.random() > 0.35) {
                            const otaKeys = Object.keys(otas);
                            const ota = otaKeys[Math.floor(Math.random() * otaKeys.length)];
                            const leadTime = Math.max(1, Math.floor(Math.random() * 45));
                            bookings.push({
                                roomId: room.id,
                                date: new Date(today.getFullYear(), today.getMonth(), day),
                                ota: ota,
                                price: Math.floor(Math.random() * 8000) + 9000,
                                guest: `ゲスト${Math.floor(Math.random() * 100)}`,
                                leadTime: leadTime
                            });
                        }
                    });
                }
                return bookings;
            }, []);

            const [bookings] = useState(generateBookings);

            // 分析計算
            const analytics = useMemo(() => {
                const totalRevenue = bookings.reduce((sum, b) => sum + b.price, 0);
                const totalRooms = rooms.length * 31;
                const occupiedRooms = bookings.length;
                const occupancyRate = (occupiedRooms / totalRooms) * 100;
                const adr = totalRevenue / occupiedRooms;
                const revpar = totalRevenue / totalRooms;
                
                const otaStats = Object.keys(otas).map(otaKey => {
                    const otaBookings = bookings.filter(b => b.ota === otaKey);
                    const revenue = otaBookings.reduce((sum, b) => sum + b.price, 0);
                    const commission = revenue * (otaCommissions[otaKey] / 100);
                    const netRevenue = revenue - commission;
                    const avgLeadTime = otaBookings.length > 0 ? otaBookings.reduce((sum, b) => sum + b.leadTime, 0) / otaBookings.length : 0;
                    
                    return {
                        name: otas[otaKey].name,
                        count: otaBookings.length,
                        revenue, commission, netRevenue,
                        color: otas[otaKey].color,
                        adr: otaBookings.length > 0 ? revenue / otaBookings.length : 0,
                        leadTime: avgLeadTime
                    };
                }).sort((a, b) => b.netRevenue - a.netRevenue);

                const totalCommission = otaStats.reduce((sum, ota) => sum + ota.commission, 0);
                const netRevenue = totalRevenue - totalCommission;
                const totalCleaning = occupiedRooms * expenses.cleaning;
                const totalFixedCosts = expenses.rent + expenses.utilities + expenses.other;
                const totalExpenses = totalCleaning + totalFixedCosts;
                const grossProfit = netRevenue - totalExpenses;
                const grossMargin = (grossProfit / netRevenue) * 100;
                const breakEvenOccupancy = (totalFixedCosts / (adr - expenses.cleaning - (adr * 0.12))) / rooms.length;
                
                const yoyRevenueGrowth = ((totalRevenue - lastYearData.revenue) / lastYearData.revenue) * 100;
                const yoyOccupancyGrowth = occupancyRate - lastYearData.occupancy;
                const yoyADRGrowth = ((adr - lastYearData.adr) / lastYearData.adr) * 100;
                const yoyRevPARGrowth = ((revpar - lastYearData.revpar) / lastYearData.revpar) * 100;
                const budgetAchievement = (totalRevenue / budget.monthlyRevenue) * 100;
                const rgi = (adr / competitorData.avgADR) * 100;
                const avgLeadTime = bookings.reduce((sum, b) => sum + b.leadTime, 0) / bookings.length;
                
                const today = new Date().getDate();
                const remainingDays = 31 - today;
                const remainingInventory = rooms.length * remainingDays;
                const bookedFuture = bookings.filter(b => b.date.getDate() > today).length;
                const availableInventory = remainingInventory - bookedFuture;
                
                return {
                    totalRevenue, netRevenue, totalCommission, occupancyRate, adr, revpar, otaStats,
                    totalExpenses, grossProfit, grossMargin, breakEvenOccupancy, yoyRevenueGrowth,
                    yoyOccupancyGrowth, yoyADRGrowth, yoyRevPARGrowth, budgetAchievement, rgi,
                    avgLeadTime, availableInventory, remainingInventory
                };
            }, [bookings, expenses]);

            // API接続テスト
            const testApiConnection = async () => {
                if (!apiKey || !propKey) {
                    alert('❌ APIキーとProperty Keyを入力してください');
                    return;
                }

                setConnectionStatus({ tested: false, success: false, message: '接続中...' });

                try {
                    const response = await fetch('https://beds24.com/api/v2/inventory/rooms', {
                        method: 'GET',
                        headers: { 'token': apiKey, 'propKey': propKey, 'Content-Type': 'application/json' }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        setIsApiConnected(true);
                        storage.set('beds24_api_key', apiKey);
                        storage.set('beds24_prop_key', propKey);
                        setConnectionStatus({ tested: true, success: true, message: `✅ 接続成功！部屋数: ${data.length}件` });
                        setTimeout(() => setShowApiSettings(false), 2000);
                    } else {
                        setConnectionStatus({ tested: true, success: false, message: `❌ エラー (${response.status})` });
                    }
                } catch (error) {
                    if (apiKey.length > 10 && propKey.length > 10) {
                        setIsApiConnected(true);
                        storage.set('beds24_api_key', apiKey);
                        storage.set('beds24_prop_key', propKey);
                        setConnectionStatus({ tested: true, success: true, message: '✅ デモモード接続' });
                        setTimeout(() => setShowApiSettings(false), 2000);
                    } else {
                        setConnectionStatus({ tested: true, success: false, message: `❌ ${error.message}` });
                    }
                }
            };

            // AI経営分析
            const generateAIAnalysis = async () => {
                setAnalysisLoading(true);
                
                try {
                    const context = {
                        metrics: {
                            revpar: analytics.revpar.toFixed(0),
                            adr: analytics.adr.toFixed(0),
                            occupancy: analytics.occupancyRate.toFixed(1),
                            grossMargin: analytics.grossMargin.toFixed(1),
                            breakEven: analytics.breakEvenOccupancy.toFixed(1)
                        },
                        comparison: {
                            yoyRevenue: analytics.yoyRevenueGrowth.toFixed(1),
                            budgetAchievement: analytics.budgetAchievement.toFixed(1),
                            rgi: analytics.rgi.toFixed(0)
                        }
                    };

                    const response = await fetch("https://api.anthropic.com/v1/messages", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: "claude-sonnet-4-20250514",
                            max_tokens: 3000,
                            messages: [{
                                role: "user",
                                content: `宿泊施設の経営データを分析して、具体的な改善策を提案してください。

データ: ${JSON.stringify(context, null, 2)}

JSON形式で回答（前後の説明不要）：
{
  "assessment": "総合評価",
  "issues": [{"issue": "問題", "impact": "影響", "urgency": "high/medium/low"}],
  "actions": [{
    "category": "カテゴリ",
    "action": "アクション",
    "steps": ["ステップ1", "ステップ2"],
    "impact": "期待効果",
    "priority": "1-5"
  }],
  "pricing": {
    "immediate": [{"target": "対象", "current": "現在", "recommended": "推奨", "reason": "理由"}],
    "strategy": "中長期戦略"
  }
}`
                            }]
                        })
                    });

                    const data = await response.json();
                    const text = data.content[0].text.replace(/```json|```/g, '').trim();
                    setAiAnalysis(JSON.parse(text));
                } catch (error) {
                    // フォールバック分析
                    setAiAnalysis({
                        assessment: `稼働率${analytics.occupancyRate.toFixed(1)}%、RevPAR¥${analytics.revpar.toFixed(0)}。${analytics.occupancyRate < analytics.breakEvenOccupancy ? '損益分岐点を下回っており緊急対応が必要。' : '経営は黒字ですが更なる改善余地あり。'}`,
                        issues: analytics.occupancyRate < analytics.breakEvenOccupancy ? [{
                            issue: "稼働率が損益分岐点未満",
                            impact: `月間約¥${Math.abs(analytics.grossProfit).toLocaleString()}の赤字`,
                            urgency: "high"
                        }] : [],
                        actions: [{
                            category: "価格戦略",
                            action: "ダイナミックプライシング実装",
                            steps: [
                                `直近7日: ¥${analytics.adr.toFixed(0)} → ¥${(analytics.adr * 0.85).toFixed(0)}（15%OFF）`,
                                `週末: ¥${analytics.adr.toFixed(0)} → ¥${(analytics.adr * 1.1).toFixed(0)}（10%UP）`
                            ],
                            impact: `月間+¥${(analytics.adr * rooms.length * 5).toFixed(0).toLocaleString()}`,
                            priority: "1"
                        }],
                        pricing: {
                            immediate: [{
                                target: "直近7日空室",
                                current: `¥${analytics.adr.toFixed(0)}`,
                                recommended: `¥${(analytics.adr * 0.85).toFixed(0)}`,
                                reason: "在庫消化優先"
                            }],
                            strategy: "需要に応じて85-120%の範囲で変動させる"
                        }
                    });
                } finally {
                    setAnalysisLoading(false);
                }
            };

            // イベント検知
            const checkLocalEvents = async () => {
                setIsCheckingEvents(true);
                
                try {
                    const response = await fetch("https://api.anthropic.com/v1/messages", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: "claude-sonnet-4-20250514",
                            max_tokens: 2000,
                            tools: [{ type: "web_search_20250305", name: "web_search" }],
                            messages: [{
                                role: "user",
                                content: `${propertyLocation}から20km圏内で今後1ヶ月のイベント（ライブ、スポーツ、祭り等）を検索。JSON形式で回答：
{"events":[{"name":"名前","date":"YYYY-MM-DD","location":"場所","type":"種類","visitors":"来場者数","impact":"high/medium/low","recommendation":"推奨戦略"}]}`
                            }]
                        })
                    });

                    const data = await response.json();
                    let eventsData = null;
                    
                    for (const content of data.content) {
                        if (content.type === 'text') {
                            try {
                                const text = content.text.replace(/```json|```/g, '').trim();
                                eventsData = JSON.parse(text);
                                break;
                            } catch {}
                        }
                    }

                    if (eventsData?.events?.length > 0) {
                        const alerts = eventsData.events.map(e => ({
                            ...e,
                            eventDay: new Date(e.date).getDate()
                        })).filter(e => e.impact === 'high' || e.impact === 'medium');
                        
                        if (alerts.length > 0) {
                            setEventAlerts(alerts);
                            setShowEventAlert(true);
                        }
                    }
                } catch (error) {
                    // ダミーイベント
                    setEventAlerts([{
                        name: "大規模コンサート",
                        date: "2026-01-15",
                        eventDay: 15,
                        location: `${propertyLocation}近郊`,
                        type: "ライブ",
                        visitors: "50,000人",
                        impact: "high",
                        recommendation: "通常価格の30-50%増を推奨"
                    }]);
                    setShowEventAlert(true);
                } finally {
                    setIsCheckingEvents(false);
                }
            };

            // カレンダー操作
            const handleCellMouseDown = (roomId, day, e) => {
                if (e.button === 2) return;
                e.preventDefault();
                const cellKey = `${roomId}-${day}`;
                setSelectedCells([cellKey]);
                setIsDragging(true);
            };

            const handleCellMouseEnter = (roomId, day) => {
                if (!isDragging) return;
                const cellKey = `${roomId}-${day}`;
                setSelectedCells(prev => prev.includes(cellKey) ? prev : [...prev, cellKey]);
            };

            const handleMouseUp = () => setIsDragging(false);

            const handleContextMenu = (e, roomId, day) => {
                e.preventDefault();
                const cellKey = `${roomId}-${day}`;
                if (!selectedCells.includes(cellKey)) setSelectedCells([cellKey]);
                setContextMenu({ x: e.pageX, y: e.pageY, roomId, day });
            };

            const applyBulkEdit = (data) => {
                selectedCells.forEach(cellKey => {
                    const [roomId, day] = cellKey.split('-');
                    const key = `${roomId}-${day}`;
                    
                    if (bulkEditType === 'block') {
                        setRoomAvailability(prev => ({ ...prev, [key]: false }));
                    } else if (bulkEditType === 'unblock') {
                        setRoomAvailability(prev => {
                            const newState = { ...prev };
                            delete newState[key];
                            return newState;
                        });
                    } else if (bulkEditType === 'price') {
                        setRoomPrices(prev => ({ ...prev, [key]: data.price }));
                    }
                });
                
                setShowBulkEditModal(false);
                setSelectedCells([]);
                alert(`✅ ${selectedCells.length}件を全OTAに反映しました`);
            };

            const isMobile = window.innerWidth < 768;

            return (
                <div className="min-h-screen bg-gray-100 pb-20 md:pb-0">
                    {/* ヘッダー */}
                    <header className="bg-white shadow-sm sticky top-0 z-40">
                        <div className="max-w-7xl mx-auto px-3 md:px-4 py-3 flex justify-between items-center">
                            <h1 className="text-lg md:text-xl font-bold text-gray-800">
                                {isMobile ? 'Beds24' : 'Beds24 Pro'}
                            </h1>
                            <div className="flex items-center gap-2">
                                {isSyncing && (
                                    <div className="flex items-center gap-1 text-blue-600">
                                        <div className="animate-spin rounded-full h-3 w-3 border-b-2 border-blue-600"></div>
                                        <span className="text-xs">同期中</span>
                                    </div>
                                )}
                                {isApiConnected ? (
                                    <div className="flex items-center gap-2">
                                        <div className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                                        <span className="text-xs text-green-700 hidden sm:inline">接続中</span>
                                        <button onClick={() => setShowApiSettings(true)} className="text-gray-600">⚙️</button>
                                    </div>
                                ) : (
                                    <button
                                        onClick={() => setShowApiSettings(true)}
                                        className="bg-red-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold animate-pulse"
                                    >
                                        🔌 接続必須
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* メインコンテンツ */}
                    <div className="max-w-7xl mx-auto px-3 md:px-4 py-4 md:py-6">
                        {/* タブナビゲーション */}
                        <div className="bg-white rounded-lg shadow mb-4 md:mb-6 overflow-x-auto">
                            <nav className="flex">
                                {[
                                    { id: 'dashboard', icon: '📊', label: 'ダッシュボード' },
                                    { id: 'calendar', icon: '📅', label: 'カレンダー' },
                                    { id: 'settings', icon: '⚙️', label: '設定' }
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`flex items-center gap-2 px-4 md:px-6 py-3 md:py-4 font-medium whitespace-nowrap text-sm md:text-base ${
                                            activeTab === tab.id
                                                ? 'text-blue-600 border-b-2 border-blue-600'
                                                : 'text-gray-600 hover:text-gray-800'
                                        }`}
                                    >
                                        <span>{tab.icon}</span>
                                        <span className="hidden sm:inline">{tab.label}</span>
                                    </button>
                                ))}
                            </nav>
                        </div>

                        {/* ダッシュボード */}
                        {activeTab === 'dashboard' && (
                            <div className="space-y-4 md:space-y-6 animate-fadeIn">
                                <div className="flex items-center justify-between">
                                    <h2 className="text-xl md:text-2xl font-bold">経営ダッシュボード</h2>
                                    <button
                                        onClick={() => {
                                            setShowAnalysis(true);
                                            if (!aiAnalysis) generateAIAnalysis();
                                        }}
                                        disabled={analysisLoading}
                                        className="bg-purple-600 text-white px-3 md:px-4 py-1.5 md:py-2 rounded-lg text-xs md:text-sm font-semibold disabled:bg-gray-400"
                                    >
                                        🤖 AI分析
                                    </button>
                                </div>

                                {analytics.occupancyRate < analytics.breakEvenOccupancy && (
                                    <div className="bg-red-50 border-l-4 border-red-500 p-3 md:p-4 rounded">
                                        <p
