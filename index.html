<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beds24経営管理システム</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            margin: 0; 
            font-family: system-ui, -apple-system, sans-serif;
        }
        .animate-pulse { animation: pulse 2s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-spin { animation: spin 1s linear infinite; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        function App() {
            const [connected, setConnected] = useState(
                !!localStorage.getItem('beds24_api_key')
            );
            const [apiKey, setApiKey] = useState(
                localStorage.getItem('beds24_api_key') || ''
            );
            const [propKey, setPropKey] = useState(
                localStorage.getItem('beds24_prop_key') || ''
            );
            const [showSettings, setShowSettings] = useState(false);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [expenses, setExpenses] = useState(() => {
                const saved = localStorage.getItem('expenses');
                return saved ? JSON.parse(saved) : {
                    rent: 500000,
                    cleaning: 3000,
                    utilities: 80000,
                    other: 120000
                };
            });

            useEffect(() => {
                localStorage.setItem('expenses', JSON.stringify(expenses));
            }, [expenses]);

            const rooms = [
                { id: 1, name: 'デラックス 101' },
                { id: 2, name: 'デラックス 102' },
                { id: 3, name: 'スタンダード 201' },
                { id: 4, name: 'スタンダード 202' },
                { id: 5, name: 'スイート 301' }
            ];

            const otas = {
                booking: { name: 'Booking', color: '#003580' },
                airbnb: { name: 'Airbnb', color: '#FF5A5F' },
                expedia: { name: 'Expedia', color: '#FFCB00' },
                direct: { name: '直接', color: '#10B981' },
                rakuten: { name: '楽天', color: '#BF0000' }
            };

            const otaCommissions = {
                booking: 15, airbnb: 3, expedia: 18, rakuten: 10, direct: 0
            };

            const generateBookings = () => {
                const bookings = [];
                const today = new Date();
                for (let day = 1; day <= 31; day++) {
                    rooms.forEach(room => {
                        if (Math.random() > 0.35) {
                            const otaKeys = Object.keys(otas);
                            const ota = otaKeys[Math.floor(Math.random() * otaKeys.length)];
                            bookings.push({
                                roomId: room.id,
                                date: new Date(today.getFullYear(), today.getMonth(), day),
                                ota: ota,
                                price: Math.floor(Math.random() * 8000) + 9000,
                                guest: `ゲスト${Math.floor(Math.random() * 100)}`
                            });
                        }
                    });
                }
                return bookings;
            };

            const [bookings] = useState(generateBookings);

            const analytics = useMemo(() => {
                const totalRevenue = bookings.reduce((sum, b) => sum + b.price, 0);
                const totalRooms = rooms.length * 31;
                const occupiedRooms = bookings.length;
                const occupancyRate = (occupiedRooms / totalRooms) * 100;
                const adr = totalRevenue / occupiedRooms;
                const revpar = totalRevenue / totalRooms;

                const otaStats = Object.keys(otas).map(otaKey => {
                    const otaBookings = bookings.filter(b => b.ota === otaKey);
                    const revenue = otaBookings.reduce((sum, b) => sum + b.price, 0);
                    const commission = revenue * (otaCommissions[otaKey] / 100);
                    const netRevenue = revenue - commission;
                    return {
                        name: otas[otaKey].name,
                        count: otaBookings.length,
                        revenue: revenue,
                        commission: commission,
                        netRevenue: netRevenue,
                        color: otas[otaKey].color
                    };
                }).sort((a, b) => b.netRevenue - a.netRevenue);

                const totalCommission = otaStats.reduce((sum, ota) => sum + ota.commission, 0);
                const netRevenue = totalRevenue - totalCommission;
                const totalCleaning = occupiedRooms * expenses.cleaning;
                const totalFixedCosts = expenses.rent + expenses.utilities + expenses.other;
                const totalExpenses = totalCleaning + totalFixedCosts;
                const grossProfit = netRevenue - totalExpenses;
                const grossMargin = (grossProfit / netRevenue) * 100;
                const breakEvenOccupancy = (totalFixedCosts / (adr - expenses.cleaning - (adr * 0.12))) / rooms.length;

                return {
                    totalRevenue, netRevenue, totalCommission, occupancyRate, adr, revpar,
                    otaStats, totalExpenses, grossProfit, grossMargin, breakEvenOccupancy
                };
            }, [bookings, expenses]);

            const handleConnect = () => {
                if (apiKey.length > 10 && propKey.length > 10) {
                    setConnected(true);
                    localStorage.setItem('beds24_api_key', apiKey);
                    localStorage.setItem('beds24_prop_key', propKey);
                    setShowSettings(false);
                    alert('✅ 接続成功！デモモードで全機能を使えます');
                } else {
                    alert('❌ APIキーとProperty Keyを10文字以上入力してください');
                }
            };

            return (
                <div className="min-h-screen bg-gray-100">
                    <header className="bg-white shadow sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                            <h1 className="text-xl font-bold">Beds24 経営管理</h1>
                            {connected ? (
                                <div className="flex items-center gap-2">
                                    <div className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                                    <span className="text-sm text-green-700">接続中</span>
                                    <button onClick={() => setShowSettings(true)} className="text-gray-600">⚙️</button>
                                </div>
                            ) : (
                                <button
                                    onClick={() => setShowSettings(true)}
                                    className="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 animate-pulse"
                                >
                                    🔌 接続
                                </button>
                            )}
                        </div>
                    </header>

                    <div className="max-w-7xl mx-auto px-4 py-6">
                        <div className="bg-white rounded-lg shadow mb-6">
                            <nav className="flex overflow-x-auto">
                                {[
                                    { id: 'dashboard', icon: '📊', label: 'ダッシュボード' },
                                    { id: 'expenses', icon: '💰', label: '経費設定' }
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`flex items-center gap-2 px-6 py-4 font-medium ${
                                            activeTab === tab.id
                                                ? 'text-blue-600 border-b-2 border-blue-600'
                                                : 'text-gray-600 hover:text-gray-800'
                                        }`}
                                    >
                                        <span>{tab.icon}</span>
                                        <span>{tab.label}</span>
                                    </button>
                                ))}
                            </nav>
                        </div>

                        {activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                {analytics.occupancyRate < analytics.breakEvenOccupancy && (
                                    <div className="bg-red-50 border-l-4 border-red-500 p-4 rounded">
                                        <p className="font-bold text-red-800">⚠️ 赤字運営中</p>
                                        <p className="text-sm text-red-700">
                                            稼働率{analytics.occupancyRate.toFixed(1)}%（損益分岐点{analytics.breakEvenOccupancy.toFixed(1)}%）
                                        </p>
                                    </div>
                                )}

                                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                                    <div className="bg-white p-4 rounded-lg shadow">
                                        <p className="text-sm text-gray-600">RevPAR</p>
                                        <p className="text-2xl font-bold text-gray-800">
                                            ¥{analytics.revpar.toFixed(0).toLocaleString()}
                                        </p>
                                    </div>
                                    <div className="bg-white p-4 rounded-lg shadow">
                                        <p className="text-sm text-gray-600">ADR</p>
                                        <p className="text-2xl font-bold text-gray-800">
                                            ¥{analytics.adr.toFixed(0).toLocaleString()}
                                        </p>
                                    </div>
                                    <div className="bg-white p-4 rounded-lg shadow">
                                        <p className="text-sm text-gray-600">稼働率</p>
                                        <p className="text-2xl font-bold text-gray-800">
                                            {analytics.occupancyRate.toFixed(1)}%
                                        </p>
                                    </div>
                                    <div className="bg-white p-4 rounded-lg shadow">
                                        <p className="text-sm text-gray-600">粗利率</p>
                                        <p className="text-2xl font-bold text-gray-800">
                                            {analytics.grossMargin.toFixed(1)}%
                                        </p>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    <div className="bg-white p-6 rounded-lg shadow">
                                        <h3 className="text-lg font-bold mb-4">収益サマリー</h3>
                                        <div className="space-y-3">
                                            <div className="flex justify-between border-b pb-2">
                                                <span className="text-gray-600">総売上</span>
                                                <span className="font-bold">¥{analytics.totalRevenue.toLocaleString()}</span>
                                            </div>
                                            <div className="flex justify-between border-b pb-2">
                                                <span className="text-gray-600">OTA手数料</span>
                                                <span className="font-bold text-red-600">-¥{analytics.totalCommission.toLocaleString()}</span>
                                            </div>
                                            <div className="flex justify-between border-b pb-2">
                                                <span className="text-gray-600">純売上</span>
                                                <span className="font-bold text-blue-600">¥{analytics.netRevenue.toLocaleString()}</span>
                                            </div>
                                            <div className="flex justify-between border-b pb-2">
                                                <span className="text-gray-600">総経費</span>
                                                <span className="font-bold text-red-600">-¥{analytics.totalExpenses.toLocaleString()}</span>
                                            </div>
                                            <div className="flex justify-between pt-2">
                                                <span className="text-lg font-bold">粗利益</span>
                                                <span className={`text-lg font-bold ${analytics.grossProfit >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                                    ¥{analytics.grossProfit.toLocaleString()}
                                                </span>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="bg-white p-6 rounded-lg shadow">
                                        <h3 className="text-lg font-bold mb-4">チャネル別分析</h3>
                                        <div className="space-y-3">
                                            {analytics.otaStats.map((ota, idx) => (
                                                <div key={idx} className="flex items-center justify-between p-3 bg-gray-50 rounded">
                                                    <div className="flex items-center gap-2">
                                                        <div className="w-3 h-3 rounded" style={{ backgroundColor: ota.color }}></div>
                                                        <span className="font-medium">{ota.name}</span>
                                                    </div>
                                                    <div className="text-right">
                                                        <p className="font-bold text-green-600">¥{ota.netRevenue.toLocaleString()}</p>
                                                        <p className="text-xs text-gray-500">{ota.count}件</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'expenses' && (
                            <div className="bg-white p-6 rounded-lg shadow">
                                <h3 className="text-lg font-bold mb-4">経費設定</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {Object.entries({
                                        rent: '月額家賃',
                                        cleaning: '1室清掃費',
                                        utilities: '水道光熱費',
                                        other: 'その他経費'
                                    }).map(([key, label]) => (
                                        <div key={key}>
                                            <label className="block text-sm font-medium mb-2">{label}（円）</label>
                                            <input
                                                type="number"
                                                value={expenses[key]}
                                                onChange={(e) => setExpenses({ ...expenses, [key]: Number(e.target.value) })}
                                                className="w-full px-4 py-2 border rounded-lg"
                                            />
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-4 p-4 bg-gray-50 rounded">
                                    <p className="text-sm text-gray-600">月間固定費合計</p>
                                    <p className="text-xl font-bold">
                                        ¥{(expenses.rent + expenses.utilities + expenses.other).toLocaleString()}
                                    </p>
                                </div>
                            </div>
                        )}
                    </div>

                    {showSettings && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-lg p-6 max-w-md w-full">
                                <h3 className="text-lg font-bold mb-4">🔌 API接続設定</h3>
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium mb-2">API Key</label>
                                        <input
                                            type="text"
                                            value={apiKey}
                                            onChange={(e) => setApiKey(e.target.value)}
                                            placeholder="APIキーを入力"
                                            className="w-full px-4 py-2 border rounded-lg"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium mb-2">Property Key</label>
                                        <input
                                            type="text"
                                            value={propKey}
                                            onChange={(e) => setPropKey(e.target.value)}
                                            placeholder="Property Keyを入力"
                                            className="w-full px-4 py-2 border rounded-lg"
                                        />
                                    </div>
                                    <div className="bg-blue-50 p-3 rounded text-sm">
                                        💡 デモモード: 10文字以上入力すれば全機能を試せます
                                    </div>
                                </div>
                                <div className="flex gap-3 mt-6">
                                    <button
                                        onClick={handleConnect}
                                        className="flex-1 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700"
                                    >
                                        接続テスト
                                    </button>
                                    <button
                                        onClick={() => setShowSettings(false)}
                                        className="flex-1 bg-gray-200 py-2 rounded-lg hover:bg-gray-300"
                                    >
                                        閉じる
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
